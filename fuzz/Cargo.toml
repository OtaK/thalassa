[package]
name = "thalassa-derive-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
thalassa = { path = "..", features = ["futures-codec"] }
asynchronous-codec = "0.7"

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_splits"
path = "fuzz_targets/codec_splits.rs"
test = false
doc = false
bench = false
